<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" fill="none">
  <!-- Sahyān Monochrome White Brand Lockup for Dark Backgrounds -->
  <g transform="translate(10, 10) scale(0.5)">
    <!-- Road Borders / Silhouette -->
    <path d="M 45 45 C 95 45, 120 78, 150 100" stroke="#A7E8D2" stroke-width="26" stroke-linecap="round"/>
    <path d="M 45 155 C 95 155, 120 122, 150 100" stroke="#A7E8D2" stroke-width="26" stroke-linecap="round"/>
    <path d="M 150 100 L 252 100" stroke="#A7E8D2" stroke-width="26" stroke-linecap="round"/>
    <path d="M 244 80 L 272 100 L 244 120 Z" fill="#A7E8D2"/>

    <!-- Inner Path -->
    <path d="M 45 45 C 95 45, 120 78, 150 100" stroke="#0B5D4B" stroke-width="20" stroke-linecap="round"/>
    <path d="M 45 155 C 95 155, 120 122, 150 100" stroke="#0B5D4B" stroke-width="20" stroke-linecap="round"/>
    <path d="M 150 100 L 250 100" stroke="#0B5D4B" stroke-width="20" stroke-linecap="round"/>
    <path d="M 244 84 L 268 100 L 244 116 Z" fill="#0B5D4B"/>

    <!-- Dashed Center Lines -->
    <path d="M 45 45 C 95 45, 120 78, 150 100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 7"/>
    <path d="M 45 155 C 95 155, 120 122, 150 100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 7"/>
    <path d="M 150 100 L 246 100" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 7"/>

    <circle cx="45" cy="45" r="14" fill="#A7E8D2" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="45" cy="45" r="7" fill="#0B5D4B"/>
    <circle cx="45" cy="155" r="14" fill="#A7E8D2" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="45" cy="155" r="7" fill="#0B5D4B"/>

    <circle cx="150" cy="100" r="22" fill="#A7E8D2" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="150" cy="100" r="14" fill="#0B5D4B"/>
    <circle cx="150" cy="100" r="7" fill="#A7E8D2"/>
  </g>

  <!-- Typography in Clean White -->
  <text x="160" y="66" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="48" 
        font-weight="800" 
        letter-spacing="-1.2" 
        fill="#FFFFFF">
    Sahyān
  </text>

  <!-- Leaf Accent in Mint -->
  <path d="M 285 30 C 295 24, 305 28, 303 38 C 295 40, 287 38, 285 30 Z" fill="#3DDC97"/>

  <!-- Macron line over 'a' -->
  <rect x="306" y="27" width="18" height="4.5" rx="2" fill="#FFFFFF"/>

  <!-- Tagline in Soft Mint -->
  <text x="162" y="94" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="14.5" 
        font-weight="600" 
        letter-spacing="0.2" 
        fill="#A7E8D2">
    Different paths. One shared journey.
  </text>
</svg>
