<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="icon_bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E6B56"/>
      <stop offset="60%" stop-color="#0B5D4B"/>
      <stop offset="100%" stop-color="#063D2E"/>
    </linearGradient>

    <!-- Symbol Core Mint Gradient -->
    <linearGradient id="icon_mint_grad" x1="180" y1="180" x2="380" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7E8D2"/>
      <stop offset="100%" stop-color="#5CC6A5"/>
    </linearGradient>

    <!-- Drop Shadow for Squircle -->
    <filter id="icon_shadow" x="-8%" y="-8%" width="116%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#031F17" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Continuous Smooth Squircle Body (Corner Radius ~ 116px for Apple/Android standard) -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#icon_bg_grad)" filter="url(#icon_shadow)"/>

  <!-- Subtle Inner Ring Highlight -->
  <rect x="26" y="26" width="460" height="460" rx="114" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Centered Sahyān Converging Route Symbol -->
  <g transform="translate(100, 100) scale(2.6)">
    <!-- Upper Route Path in Pure White -->
    <path d="M 22 28 C 36 28 52 40 64 54 L 88 54 C 92 54 94 57 92 60 L 76 74 C 73 76 69 74 69 70 L 69 66 C 58 56 46 44 22 44 C 18 44 16 40 16 36 C 16 32 18 28 22 28 Z" 
          fill="#FFFFFF" fill-opacity="0.95"/>

    <!-- Lower Route Path in Pure White -->
    <path d="M 22 92 C 36 92 52 80 64 66 L 88 66 C 92 66 94 63 92 60 L 76 46 C 73 44 69 46 69 50 L 69 54 C 58 64 46 76 22 76 C 18 76 16 80 16 84 C 16 88 18 92 22 92 Z" 
          fill="#FFFFFF" fill-opacity="0.95"/>

    <!-- Converging Match Apex in Luminous Soft Mint -->
    <path d="M 58 60 L 78 43 C 81 40 86 42 86 47 L 86 73 C 86 78 81 80 78 77 L 58 60 Z" 
          fill="url(#icon_mint_grad)"/>

    <!-- Optimal Sync Focal Node -->
    <circle cx="68" cy="60" r="5" fill="#FFFFFF"/>
  </g>
</svg>
