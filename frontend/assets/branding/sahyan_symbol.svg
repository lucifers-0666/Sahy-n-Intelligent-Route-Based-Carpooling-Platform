<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Sahyān Master Route Convergence Symbol (Two origins, one convergence, shared destination) -->
  <!-- Origin Node 1 -->
  <circle cx="16" cy="28" r="7.5" fill="#3DDC97"/>
  <!-- Origin Node 2 -->
  <circle cx="16" cy="72" r="7.5" fill="#3DDC97"/>
  <!-- Top-left Route Inlet -->
  <path d="M 16 28 C 42 28 50 50 66 50 L 82 50" 
        stroke="#3DDC97" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- Bottom-left Route Inlet -->
  <path d="M 16 72 C 42 72 50 50 66 50 L 82 50" 
        stroke="#3DDC97" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- Destination Terminal Node -->
  <circle cx="84" cy="50" r="7.5" fill="#3DDC97"/>
</svg>
